name: Check flight prices
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      demo:
        description: 'Sample search only (no Firestore)'
        type: boolean
        default: false
concurrency:
  group: checker
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fast-flights==3.1.0 typing_extensions==4.16.0
      - run: python checker/check.py ${{ inputs.demo && '--demo' || '' }}
