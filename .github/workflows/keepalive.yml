# GitHub pauses scheduled jobs after 60 days with no commits. This makes one a month.
name: Keep checker alive
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .keepalive
          git config user.name "flightdeals-bot"
          git config user.email "flightdeals-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "Keep scheduled checks running"
          git push
